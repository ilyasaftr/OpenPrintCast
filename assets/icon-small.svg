<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>OpenPrintCast (simplified)</title>
  <!-- Simplified design for 17-32 px: flat tile, thick strokes, no details.
       Everything sits on a 16 x 16 grid of 64 units, so edges stay crisp at
       16 and 32 px. The 16 px icon draws the waves as whole pixels instead. -->
  <defs>
    <mask id="behindBody" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="128" y="512" width="768" height="256" rx="96" fill="#000" stroke="#000" stroke-width="128"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#2563eb"/>

  <g fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round">
    <path d="M398.86 270.86A160 160 0 0 1 625.14 270.86"/>
    <path d="M308.35 180.35A288 288 0 0 1 715.65 180.35"/>
  </g>
  <circle cx="512" cy="384" r="64" fill="#fff"/>

  <rect x="256" y="768" width="512" height="192" rx="32" fill="#fff" mask="url(#behindBody)"/>
  <rect x="128" y="512" width="768" height="256" rx="96" fill="#fff"/>
</svg>
