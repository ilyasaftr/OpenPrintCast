name: pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes the waiting deployment of the same site:
# only the newest content matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # package validates and bundles the site on every trigger; deploy below
  # publishes it on main. The site is static — the job is a package, not a
  # build — so pull requests get the same proof without publishing.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
